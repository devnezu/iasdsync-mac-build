# Builds the Mac .dmg files of a private source repository on GitHub's free public-repository Mac runners.
# This repository holds only this recipe: the source is checked out with a read-only deploy key (secret
# SOURCE_DEPLOY_KEY) and never committed here. Runs only by hand (workflow_dispatch needs write access here), never on
# pull requests, so the key is never exposed to forks. Nothing is published: the .dmg and the update files are kept as
# artifacts of the run (public, like the .dmg will be).
#   gh workflow run build.yml -R devnezu/iasdsync-mac-build -f ref=feature/macos -f targets=monterey-x64
name: Mac build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch ou commit do código
        required: true
        default: feature/macos
      targets:
        description: "monterey-x64, monterey-arm64, public-x64, public-arm64 (separados por vírgula) ou all"
        required: true
        default: monterey-x64

permissions:
  contents: read

concurrency:
  group: mac-build-${{ inputs.ref }}-${{ inputs.targets }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          node -e '
            const all = {
              "public-x64": ["x64", "public", "macos-15-intel"],
              "public-arm64": ["arm64", "public", "macos-15"],
              "monterey-x64": ["x64", "monterey", "macos-15-intel"],
              "monterey-arm64": ["arm64", "monterey", "macos-15"],
            }
            const raw = process.env.TARGETS.trim()
            const want = raw === "all" ? Object.keys(all) : raw.split(",").map((t) => t.trim()).filter(Boolean)
            const unknown = want.filter((t) => !all[t])
            if (!want.length || unknown.length) { console.error("Alvo desconhecido: " + unknown.join(", ")); process.exit(1) }
            const include = [...new Set(want)].map((t) => ({ arch: all[t][0], variant: all[t][1], runner: all[t][2] }))
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify({ include }) + "\n")
          '

  dmg:
    name: dmg (${{ matrix.arch }} ${{ matrix.variant }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    env:
      IASD_MAC_ARCH: ${{ matrix.arch }}
      IASD_MAC_VARIANT: ${{ matrix.variant }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=6144
      IASD_SMOKE_SHOTS_DIR: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@v4
        with:
          repository: devnezu/iSync
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cmake --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/syncdl/target/release
            vendor/media-tools-cache
          key: mac-${{ matrix.arch }}-${{ matrix.variant }}-${{ hashFiles('native/syncdl/Cargo.lock', 'scripts/macos/media-tools-sources.darwin.json', 'scripts/macos/canvas-deps.*.txt', 'scripts/macos/variant.cjs') }}

      - name: Dependências
        run: npm ci --no-audit --no-fund

      - name: Testes de plataforma
        run: |
          node --test "scripts/macos/*.test.mjs"
          node scripts/macos/mac-update-electron-check.mjs

      - name: Build e portão de release
        run: node scripts/macos/build-mac.mjs

      - name: Relatório do pacote
        if: always()
        run: |
          ls -la release/mac-* || true
          shasum -a 256 release/mac-*/*.dmg || true

      - uses: actions/upload-artifact@v4
        with:
          name: IasdSync-mac-${{ matrix.arch }}-${{ matrix.variant }}
          path: release/mac-*/*.dmg
          if-no-files-found: error
          retention-days: 30

      # Self-update files: an UNSIGNED list plus the new files; published only from the machine with the key.
      - uses: actions/upload-artifact@v4
        with:
          name: IasdSync-mac-update-${{ matrix.arch }}-${{ matrix.variant }}
          path: release/mac-*/update/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-mac-${{ matrix.arch }}-${{ matrix.variant }}
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
